[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obs-py"
version = "0.1.0"
description = "One-call OpenTelemetry + Prometheus + JSON logging setup, with AI inference helpers"
requires-python = ">=3.9"
dependencies = [
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/obs"]
