name: publish onboarding chart
on:
  push:
    branches: [main]
    paths: [charts/observability-onboarding/**]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: helm package charts/observability-onboarding && helm push observability-onboarding-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
