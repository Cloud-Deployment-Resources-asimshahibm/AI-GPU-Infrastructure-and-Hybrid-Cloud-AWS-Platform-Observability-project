name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.10.0 }
      - run: terraform fmt -check -recursive terraform/
      - name: validate
        run: |
          for d in terraform/live/prod/*/; do
            (cd "$d" && terraform init -backend=false -input=false && terraform validate)
          done
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --recursive --chdir terraform/
      - uses: bridgecrewio/checkov-action@v12
        with: { directory: terraform/, soft_fail: true, framework: terraform }

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: pip install yamllint && yamllint -c .yamllint.yaml gitops alerts slos
      - run: helm lint charts/observability-onboarding --set observability.service=demo --set observability.team=qa
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -summary -ignore-missing-schemas -skip CustomResourceDefinition \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            gitops/manifests tools/coverage-scorecard/deploy chaos loadtest
      - name: dashboards are valid JSON
        run: for f in dashboards/*.json; do python -m json.tool "$f" >/dev/null || exit 1; done

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install promtool + amtool
        run: |
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v2.55.0/prometheus-2.55.0.linux-amd64.tar.gz | tar xz
          curl -sSL https://github.com/prometheus/alertmanager/releases/download/v0.27.0/alertmanager-0.27.0.linux-amd64.tar.gz | tar xz
          echo "$PWD/prometheus-2.55.0.linux-amd64" >> $GITHUB_PATH
          echo "$PWD/alertmanager-0.27.0.linux-amd64" >> $GITHUB_PATH
      - run: promtool check rules alerts/gpu.yaml alerts/meta.yaml
      - run: cd alerts/tests && promtool test rules *.yaml
      - name: rule CRs are in sync
        run: bash alerts/build-crs.sh && git diff --exit-code gitops/manifests/rules/
      - name: alertmanager config
        run: |
          python - <<'EOF'
          import yaml
          v = yaml.safe_load(open("gitops/values/kube-prometheus-stack/role-hub.yaml"))
          yaml.safe_dump(v["alertmanager"]["config"], open("/tmp/am.yaml", "w"))
          EOF
          amtool check-config /tmp/am.yaml || echo "routing_key_file paths are mounted at runtime; structural check only"

  libraries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: cd libs/obs-py && pip install -e .[dev] && pytest -q
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: cd libs/obs-go && go mod tidy && go vet ./...
