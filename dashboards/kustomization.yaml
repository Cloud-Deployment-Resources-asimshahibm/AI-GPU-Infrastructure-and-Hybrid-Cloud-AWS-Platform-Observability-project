apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
  - name: dash-gpu-fleet
    files: [gpu-fleet.json]
    options: { annotations: { grafana_folder: "GPU & AI" } }
  - name: dash-inference-service
    files: [inference-service.json]
    options: { annotations: { grafana_folder: "GPU & AI" } }
  - name: dash-cloud-overview
    files: [cloud-overview.json]
    options: { annotations: { grafana_folder: "Cloud" } }
  - name: dash-platform-health
    files: [platform-health.json]
    options: { annotations: { grafana_folder: "Observability Platform" } }
