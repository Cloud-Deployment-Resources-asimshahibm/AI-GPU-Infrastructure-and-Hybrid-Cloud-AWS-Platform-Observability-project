apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cert-manager
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - clusters:
        selector:
          matchLabels: { obs: enabled }
          matchExpressions:
            - { key: role, operator: In, values: [hub, gpu, aws, azure] }
  template:
    metadata:
      name: 'cert-manager-{{ .name }}'
      annotations:
        argocd.argoproj.io/sync-wave: "-5"
    spec:
      project: observability
      sources:
        - repoURL: https://charts.jetstack.io
          chart: cert-manager
          targetRevision: v1.16.1
          helm:
            releaseName: cert-manager
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/gitops/values/cert-manager/values.yaml
              - $values/gitops/values/cert-manager/role-{{ index .metadata.labels "role" }}.yaml
              - $values/gitops/values/cert-manager/cluster-{{ .name }}.yaml
        - repoURL: https://github.com/Cloud-Deployment-Resources-asimshahibm/hybrid-observability-platform.git
          targetRevision: main
          ref: values
      destination:
        server: '{{ .server }}'
        namespace: cert-manager
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
