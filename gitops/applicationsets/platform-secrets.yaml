apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-secrets
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - clusters:
        selector:
          matchLabels: { obs: enabled }
          matchExpressions:
            - { key: role, operator: In, values: [hub, gpu, aws, azure] }
  template:
    metadata:
      name: 'platform-secrets-{{ .name }}'
      annotations:
        argocd.argoproj.io/sync-wave: "-3"
    spec:
      project: observability
      source:
        repoURL: https://github.com/asimshahibm/hybrid-observability-platform.git
        targetRevision: main
        path: gitops/manifests/secrets
        directory:
          recurse: true
          include: '*.yaml'
      destination:
        server: '{{ .server }}'
        namespace: observability
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
