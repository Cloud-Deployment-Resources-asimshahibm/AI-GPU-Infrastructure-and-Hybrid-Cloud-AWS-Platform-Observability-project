apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tempo
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - clusters:
        selector:
          matchLabels: { obs: enabled }
          matchExpressions:
            - { key: role, operator: In, values: [hub] }
  template:
    metadata:
      name: 'tempo-{{ .name }}'
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      project: observability
      sources:
        - repoURL: https://grafana.github.io/helm-charts
          chart: tempo-distributed
          targetRevision: 1.18.4
          helm:
            releaseName: tempo
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/gitops/values/tempo/values.yaml
              - $values/gitops/values/tempo/role-{{ index .metadata.labels "role" }}.yaml
              - $values/gitops/values/tempo/cluster-{{ .name }}.yaml
        - repoURL: https://github.com/Cloud-Deployment-Resources-asimshahibm/hybrid-observability-platform.git
          targetRevision: main
          ref: values
      destination:
        server: '{{ .server }}'
        namespace: observability
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
