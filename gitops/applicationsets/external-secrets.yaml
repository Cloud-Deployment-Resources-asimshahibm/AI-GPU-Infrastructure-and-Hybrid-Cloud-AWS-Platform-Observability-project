apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - clusters:
        selector:
          matchLabels: { obs: enabled }
          matchExpressions:
            - { key: role, operator: In, values: [hub, gpu, aws, azure] }
  template:
    metadata:
      name: 'external-secrets-{{ .name }}'
      annotations:
        argocd.argoproj.io/sync-wave: "-5"
    spec:
      project: observability
      sources:
        - repoURL: https://charts.external-secrets.io
          chart: external-secrets
          targetRevision: 0.10.4
          helm:
            releaseName: external-secrets
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/gitops/values/external-secrets/values.yaml
              - $values/gitops/values/external-secrets/role-{{ index .metadata.labels "role" }}.yaml
              - $values/gitops/values/external-secrets/cluster-{{ .name }}.yaml
        - repoURL: https://github.com/asimshahibm/hybrid-observability-platform.git
          targetRevision: main
          ref: values
      destination:
        server: '{{ .server }}'
        namespace: external-secrets
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
