apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: probes
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - clusters:
        selector:
          matchLabels: { obs: enabled }
          matchExpressions:
            - { key: role, operator: In, values: [hub] }
  template:
    metadata:
      name: 'probes-{{ .name }}'
      annotations:
        argocd.argoproj.io/sync-wave: "6"
    spec:
      project: observability
      source:
        repoURL: https://github.com/asimshahibm/hybrid-observability-platform.git
        targetRevision: main
        path: gitops/manifests/probes
        directory:
          recurse: true
          include: '*.yaml'
      destination:
        server: '{{ .server }}'
        namespace: observability
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
