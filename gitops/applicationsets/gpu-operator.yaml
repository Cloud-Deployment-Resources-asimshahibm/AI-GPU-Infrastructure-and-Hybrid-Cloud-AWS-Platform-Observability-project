apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gpu-operator
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - clusters:
        selector:
          matchLabels: { obs: enabled }
          matchExpressions:
            - { key: role, operator: In, values: [gpu, aws] }
  template:
    metadata:
      name: 'gpu-operator-{{ .name }}'
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      project: observability
      sources:
        - repoURL: https://helm.ngc.nvidia.com/nvidia
          chart: gpu-operator
          targetRevision: v24.9.0
          helm:
            releaseName: gpu-operator
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/gitops/values/gpu-operator/values.yaml
              - $values/gitops/values/gpu-operator/role-{{ index .metadata.labels "role" }}.yaml
              - $values/gitops/values/gpu-operator/cluster-{{ .name }}.yaml
        - repoURL: https://github.com/asimshahibm/AI-GPU-Infrastructure-and-Cloud-AWS-Azure-Platform-Observability-project.git
          targetRevision: main
          ref: values
      destination:
        server: '{{ .server }}'
        namespace: gpu-operator
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
