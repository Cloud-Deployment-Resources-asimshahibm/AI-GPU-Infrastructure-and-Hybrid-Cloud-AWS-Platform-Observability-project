apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: yace
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - clusters:
        selector:
          matchLabels: { obs: enabled }
          matchExpressions:
            - { key: role, operator: In, values: [aws] }
  template:
    metadata:
      name: 'yace-{{ .name }}'
      annotations:
        argocd.argoproj.io/sync-wave: "3"
    spec:
      project: observability
      sources:
        - repoURL: https://prometheus-community.github.io/helm-charts
          chart: prometheus-yet-another-cloudwatch-exporter
          targetRevision: 0.38.0
          helm:
            releaseName: yace
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/gitops/values/yace/values.yaml
              - $values/gitops/values/yace/role-{{ index .metadata.labels "role" }}.yaml
              - $values/gitops/values/yace/cluster-{{ .name }}.yaml
        - repoURL: https://github.com/Cloud-Deployment-Resources-asimshahibm/hybrid-observability-platform.git
          targetRevision: main
          ref: values
      destination:
        server: '{{ .server }}'
        namespace: observability
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
