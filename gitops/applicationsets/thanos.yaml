apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: thanos
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - clusters:
        selector:
          matchLabels: { obs: enabled }
          matchExpressions:
            - { key: role, operator: In, values: [hub] }
  template:
    metadata:
      name: 'thanos-{{ .name }}'
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      project: observability
      sources:
        - repoURL: https://charts.bitnami.com/bitnami
          chart: thanos
          targetRevision: 15.7.27
          helm:
            releaseName: thanos
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/gitops/values/thanos/values.yaml
              - $values/gitops/values/thanos/role-{{ index .metadata.labels "role" }}.yaml
              - $values/gitops/values/thanos/cluster-{{ .name }}.yaml
        - repoURL: https://github.com/Cloud-Deployment-Resources-asimshahibm/hybrid-observability-platform.git
          targetRevision: main
          ref: values
      destination:
        server: '{{ .server }}'
        namespace: observability
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
