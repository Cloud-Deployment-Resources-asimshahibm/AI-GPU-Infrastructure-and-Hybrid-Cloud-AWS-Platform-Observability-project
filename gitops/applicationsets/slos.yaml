apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slos
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: observability
  source:
    repoURL: https://github.com/Cloud-Deployment-Resources-asimshahibm/AI-GPU-Infrastructure-and-Cloud-AWS-Platform-Observability-project.git
    targetRevision: main
    path: slos
  destination:
    name: hub
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
