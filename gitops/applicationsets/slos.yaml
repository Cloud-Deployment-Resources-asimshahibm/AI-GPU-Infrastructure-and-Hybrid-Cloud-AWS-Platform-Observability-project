apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slos
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: observability
  source:
    repoURL: https://github.com/asimshahibm/hybrid-observability-platform.git
    targetRevision: main
    path: slos
  destination:
    name: hub
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
