apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: blackbox-exporter
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - clusters:
        selector:
          matchLabels: { obs: enabled }
          matchExpressions:
            - { key: role, operator: In, values: [hub] }
  template:
    metadata:
      name: 'blackbox-exporter-{{ .name }}'
      annotations:
        argocd.argoproj.io/sync-wave: "3"
    spec:
      project: observability
      sources:
        - repoURL: https://prometheus-community.github.io/helm-charts
          chart: prometheus-blackbox-exporter
          targetRevision: 9.0.1
          helm:
            releaseName: blackbox-exporter
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/gitops/values/blackbox-exporter/values.yaml
              - $values/gitops/values/blackbox-exporter/role-{{ index .metadata.labels "role" }}.yaml
              - $values/gitops/values/blackbox-exporter/cluster-{{ .name }}.yaml
        - repoURL: https://github.com/Cloud-Deployment-Resources-asimshahibm/AI-GPU-Infrastructure-and-Cloud-AWS-Platform-Observability-project.git
          targetRevision: main
          ref: values
      destination:
        server: '{{ .server }}'
        namespace: observability
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
