deploymentMode: SimpleScalable
loki:
  auth_enabled: true            # multi-tenant: X-Scope-OrgID = team
  commonConfig:
    replication_factor: 3
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index: { prefix: index_, period: 24h }
  storage:
    type: s3
    bucketNames:
      chunks: acme-obs-logs-prod
      ruler: acme-obs-logs-prod
    s3:
      region: us-east-1
  limits_config:
    retention_period: 720h          # 30 days default
    ingestion_rate_mb: 20
    ingestion_burst_size_mb: 40
    max_global_streams_per_user: 20000
    max_query_series: 5000
    allow_structured_metadata: true
    volume_enabled: true
    retention_stream:
      - { selector: '{level="debug"}', priority: 1, period: 168h }
  compactor:
    retention_enabled: true
    delete_request_store: s3
  runtimeConfig:
    overrides:
      security:
        retention_period: 8760h      # audit/security tenant: 1 year
      ai-platform:
        ingestion_rate_mb: 40
serviceAccount:
  name: loki
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/acme-obs-loki
write:
  replicas: 3
  persistence: { size: 50Gi }
read:
  replicas: 3
backend:
  replicas: 3
gateway:
  replicas: 2
monitoring:
  serviceMonitor: { enabled: true }
