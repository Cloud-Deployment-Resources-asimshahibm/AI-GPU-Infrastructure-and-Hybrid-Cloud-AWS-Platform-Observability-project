kind: DaemonSet
tolerations:
  - operator: Exists
extraVolumes:
  - name: buffer
    hostPath: { path: /var/lib/fluent-bit/buffer }
extraVolumeMounts:
  - { name: buffer, mountPath: /var/lib/fluent-bit/buffer }
env:
  - name: KAFKA_PASSWORD
    valueFrom: { secretKeyRef: { name: kafka-fluent-bit, key: password } }
  - name: CLUSTER_NAME
    valueFrom: { configMapKeyRef: { name: cluster-info, key: name } }
serviceMonitor:
  enabled: true
config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 5
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On
        storage.path /var/lib/fluent-bit/buffer
        storage.sync normal
        storage.backlog.mem_limit 64M
  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        multiline.parser docker, cri
        Tag kube.*
        Mem_Buf_Limit 32MB
        Skip_Long_Lines On
        storage.type filesystem
  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude On
        Labels On
        Annotations Off
        Namespace_Labels On
    [FILTER]
        Name record_modifier
        Match *
        Record cluster ${CLUSTER_NAME}
  outputs: |
    [OUTPUT]
        Name kafka
        Match *
        Brokers kafka-bootstrap.example.com:9093
        Topics logs.raw
        Format json
        Timestamp_Key @timestamp
        storage.total_limit_size 5G
        rdkafka.security.protocol SASL_SSL
        rdkafka.sasl.mechanism SCRAM-SHA-512
        rdkafka.sasl.username fluent-bit
        rdkafka.sasl.password ${KAFKA_PASSWORD}
        rdkafka.compression.codec zstd
        rdkafka.queue.buffering.max.ms 500
