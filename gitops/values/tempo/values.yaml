storage:
  trace:
    backend: s3
    s3:
      bucket: acme-obs-traces-prod
      endpoint: s3.us-east-1.amazonaws.com
      region: us-east-1
serviceAccount:
  name: tempo
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/acme-obs-tempo
multitenancyEnabled: true
traces:
  otlp:
    grpc: { enabled: true }
    http: { enabled: true }
distributor:
  replicas: 3
ingester:
  replicas: 3
  config:
    replication_factor: 3
  zoneAwareReplication:
    enabled: true
querier:
  replicas: 2
queryFrontend:
  replicas: 2
compactor:
  config:
    compaction:
      block_retention: 336h       # 14 days
metricsGenerator:
  enabled: true
  config:
    storage:
      remote_write:
        - url: http://kube-prometheus-stack-prometheus.monitoring:9090/api/v1/write
          send_exemplars: true
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
    ingestion:
      rate_limit_bytes: 30000000
      burst_size_bytes: 40000000
    global:
      max_bytes_per_trace: 5000000
metaMonitoring:
  serviceMonitor: { enabled: true }
