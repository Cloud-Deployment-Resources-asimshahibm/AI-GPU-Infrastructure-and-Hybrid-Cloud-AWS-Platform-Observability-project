apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: obs-analytics
  namespace: observability
spec:
  configuration:
    zookeeper:
      nodes:
        - { host: keeper-obs-keeper, port: 2181 }
    users:
      vector/k8s_secret_password: observability/clickhouse-vector/password
      vector/networks/ip: ["::/0"]
      grafana/k8s_secret_password: observability/clickhouse-grafana/password
      grafana/profile: readonly
      grafana/networks/ip: ["::/0"]
    profiles:
      readonly/readonly: 1
    clusters:
      - name: obs
        layout:
          shardsCount: 2
          replicasCount: 2
  defaults:
    templates:
      podTemplate: ch-pod
      dataVolumeClaimTemplate: ch-data
  templates:
    podTemplates:
      - name: ch-pod
        spec:
          tolerations:
            - { key: dedicated, operator: Equal, value: observability, effect: NoSchedule }
          containers:
            - name: clickhouse
              image: clickhouse/clickhouse-server:24.8
              resources:
                requests: { cpu: "2", memory: 16Gi }
    volumeClaimTemplates:
      - name: ch-data
        spec:
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: 500Gi } }
