apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-secrets
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: platform }
  target: { name: grafana-secrets }
  data:
    - secretKey: GF_DATABASE_PASSWORD
      remoteRef: { key: observability/grafana, property: db_password }
    - secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
      remoteRef: { key: observability/grafana, property: oauth_client_secret }
    - secretKey: CLICKHOUSE_GRAFANA_PASSWORD
      remoteRef: { key: observability/clickhouse, property: grafana_password }
