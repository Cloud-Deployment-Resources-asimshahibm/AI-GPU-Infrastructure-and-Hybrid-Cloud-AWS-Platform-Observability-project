apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pagerduty-keys
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: platform }
  target: { name: pagerduty-keys }
  dataFrom:
    - extract: { key: observability/pagerduty }   # keys: ai-platform, sre, observability-platform, slack-webhook, heartbeat-url
