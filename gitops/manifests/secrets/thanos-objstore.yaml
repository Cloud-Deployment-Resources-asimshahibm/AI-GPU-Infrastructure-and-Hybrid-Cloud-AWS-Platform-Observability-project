apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: thanos-objstore
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: platform }
  target:
    name: thanos-objstore
    template:
      data:
        objstore.yml: |
          type: S3
          config:
            bucket: acme-obs-metrics-prod
            endpoint: s3.us-east-1.amazonaws.com
            region: us-east-1
            aws_sdk_auth: true
  data:
    - secretKey: placeholder
      remoteRef: { key: observability/thanos, property: bucket }
