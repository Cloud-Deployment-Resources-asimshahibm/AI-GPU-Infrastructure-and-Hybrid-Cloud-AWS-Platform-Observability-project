# Pick the store that matches the cluster (AWS Secrets Manager on EKS/hub, Key Vault on AKS, Vault on-prem).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: platform
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef: { name: external-secrets, namespace: external-secrets }
