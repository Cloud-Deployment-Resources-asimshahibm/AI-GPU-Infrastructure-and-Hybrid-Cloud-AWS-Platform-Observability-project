apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-agent
  namespace: observability
spec:
  mode: daemonset
  tolerations:
    - operator: Exists
  resources:
    limits: { memory: 512Mi }
  env:
    - name: K8S_NODE_NAME
      valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
  config:
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      memory_limiter: { check_interval: 1s, limit_percentage: 80, spike_limit_percentage: 20 }
      k8sattributes:
        filter: { node_from_env_var: K8S_NODE_NAME }
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.deployment.name, k8s.node.name]
          labels:
            - { tag_name: team, key: team, from: pod }
            - { tag_name: service.name, key: service, from: pod }
      resource:
        attributes:
          - { key: k8s.cluster.name, value: "${env:CLUSTER_NAME}", action: upsert }
      batch: { send_batch_size: 1024, timeout: 2s }
    exporters:
      otlp:
        endpoint: otel-gateway.example.com:4317
        tls: { insecure: false }
        sending_queue: { enabled: true, queue_size: 5000 }
        retry_on_failure: { enabled: true, max_elapsed_time: 300s }
    service:
      telemetry:
        metrics: { level: detailed }
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [otlp]
