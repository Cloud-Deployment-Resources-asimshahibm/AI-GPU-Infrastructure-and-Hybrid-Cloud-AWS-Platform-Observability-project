# Tier 1: receives from all agents, routes every span of a trace to the same sampler by trace_id
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-gateway
  namespace: observability
spec:
  mode: deployment
  replicas: 3
  autoscaler: { minReplicas: 3, maxReplicas: 10, targetCPUUtilization: 70 }
  ingress:
    type: ingress
    hostname: otel-gateway.example.com
  config:
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
    processors:
      memory_limiter: { check_interval: 1s, limit_percentage: 80, spike_limit_percentage: 20 }
    exporters:
      loadbalancing:
        routing_key: traceID
        protocol:
          otlp:
            tls: { insecure: true }
        resolver:
          k8s:
            service: otel-sampler-collector-headless.observability
            ports: [4317]
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter]
          exporters: [loadbalancing]
