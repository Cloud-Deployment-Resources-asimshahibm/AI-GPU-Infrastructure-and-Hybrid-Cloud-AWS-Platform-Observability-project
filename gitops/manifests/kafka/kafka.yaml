apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: brokers
  namespace: observability
  labels: { strimzi.io/cluster: obs-kafka }
spec:
  replicas: 3
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - { id: 0, type: persistent-claim, size: 1Ti, deleteClaim: false, kraftMetadata: shared }
  resources:
    requests: { cpu: "2", memory: 8Gi }
    limits: { memory: 8Gi }
  template:
    pod:
      tolerations:
        - { key: dedicated, operator: Equal, value: observability, effect: NoSchedule }
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: obs-kafka
  namespace: observability
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.8.0
    rack:
      topologyKey: topology.kubernetes.io/zone
    listeners:
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication: { type: scram-sha-512 }
      - name: external
        port: 9094
        type: loadbalancer
        tls: true
        authentication: { type: scram-sha-512 }
        configuration:
          bootstrap:
            annotations:
              service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    authorization:
      type: simple
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      auto.create.topics.enable: false
      compression.type: producer
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef: { name: kafka-metrics, key: kafka-metrics-config.yml }
  entityOperator:
    topicOperator: {}
    userOperator: {}
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
