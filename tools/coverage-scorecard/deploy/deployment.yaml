apiVersion: apps/v1
kind: Deployment
metadata:
  name: coverage-scorecard
  namespace: observability
  labels: { team: observability-platform, service: coverage-scorecard }
spec:
  replicas: 1
  selector:
    matchLabels: { app: coverage-scorecard }
  template:
    metadata:
      labels: { app: coverage-scorecard, team: observability-platform, service: coverage-scorecard }
    spec:
      containers:
        - name: scorecard
          image: ghcr.io/cloud-deployment-resources-asimshahibm/coverage-scorecard:0.1.0
          ports: [{ name: http-metrics, containerPort: 9100 }]
          volumeMounts: [{ name: catalog, mountPath: /config }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: catalog
          configMap: { name: coverage-catalog }
---
apiVersion: v1
kind: Service
metadata:
  name: coverage-scorecard
  namespace: observability
  labels: { service: coverage-scorecard, team: observability-platform }
spec:
  selector: { app: coverage-scorecard }
  ports: [{ name: http-metrics, port: 9100 }]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: coverage-scorecard
  namespace: observability
spec:
  selector:
    matchLabels: { service: coverage-scorecard }
  endpoints: [{ port: http-metrics, interval: 60s }]
